<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTG Commander</title>
    <script>
      // Dark-only theme (the UI is dark-first). High-contrast is opt-in.
      (function () {
        try {
          if (localStorage.getItem("mtgc-contrast") === "1") document.documentElement.classList.add("contrast");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
