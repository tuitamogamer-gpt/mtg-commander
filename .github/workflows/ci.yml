name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "ci-test-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @mtgc/server exec prisma generate
      - name: Build shared package
        run: pnpm --filter @mtgc/shared build
      - name: Lint (typecheck)
        run: pnpm lint
      - name: Unit + integration tests
        run: pnpm -r test
      - name: Build
        run: pnpm build

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: build-test
    env:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "ci-test-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mtgc/server exec prisma generate
      - name: Create + migrate dev database
        run: pnpm --filter @mtgc/server exec prisma db push
      - name: Seed precons (MTGJSON)
        run: pnpm db:seed:precons
      - name: Install Playwright browsers
        run: pnpm test:e2e:install
      - name: Run e2e
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
